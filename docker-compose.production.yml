version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.production
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql+asyncpg://hacksphere:${DB_PASSWORD}@postgres:5432/hacksphere
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hacksphere
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hacksphere
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: hacksphere
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hacksphere"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hacksphere
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hacksphere
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.production
    command: celery -A app.core.celery worker --loglevel=info --concurrency=4 -Q default,quiz,debugging
    volumes:
      - ./uploads:/app/uploads
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql+asyncpg://hacksphere:${DB_PASSWORD}@postgres:5432/hacksphere
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hacksphere
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.production
    command: celery -A app.core.celery beat --loglevel=info
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql+asyncpg://hacksphere:${DB_PASSWORD}@postgres:5432/hacksphere
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hacksphere
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      - ./uploads:/var/www/uploads:ro
    depends_on:
      - api
    networks:
      - hacksphere
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  hacksphere:
    driver: bridge
