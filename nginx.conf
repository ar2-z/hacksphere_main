worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ws:10m rate=10r/s;

    # Backend servers for API requests (load balanced)
    upstream backend_api {
        least_conn;
        server BACKEND_IP_1:8000;
        server BACKEND_IP_2:8000;
    }

    # Backend servers for WebSocket (sticky sessions by client IP)
    upstream backend_ws {
        ip_hash;
        server BACKEND_IP_1:8000;
        server BACKEND_IP_2:8000;
    }

    # Backend servers for health checks
    upstream backend_health {
        least_conn;
        server BACKEND_IP_1:8000;
        server BACKEND_IP_2:8000;
    }

    # Server block
    server {
        listen 80;
        server_name _;

        # Frontend static files
        location / {
            root /app/frontend/dist;
            try_files $uri $uri/ /index.html;

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                expires 1h;
                add_header Cache-Control "public, immutable";
            }
        }

        # API proxy (least connections)
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # WebSocket proxy (sticky sessions by IP)
        location /ws/ {
            limit_req zone=ws burst=5 nodelay;
            proxy_pass http://backend_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Health check
        location /health {
            proxy_pass http://backend_health;
            proxy_set_header Host $host;
        }

        # Backend docs (direct backend access only)
        location /docs {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
        }

        # Block access to sensitive paths
        location ~ /\. {
            deny all;
        }
    }
}
