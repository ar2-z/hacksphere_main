version: "3.9"

# Combined setup: runs on the load balancer laptop
# Backend instances connect to external PostgreSQL (Render or other)
services:
  balancer:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/app/frontend/dist:ro
    restart: unless-stopped
    networks:
      - hacksphere

  backend1:
    build: .
    env_file: .env.production
    environment:
      - WEB_CONCURRENCY=4
      - PORT=8000
      - APP_ENV=production
    restart: unless-stopped
    networks:
      - hacksphere

  backend2:
    build: .
    env_file: .env.production
    environment:
      - WEB_CONCURRENCY=4
      - PORT=8000
      - APP_ENV=production
    restart: unless-stopped
    networks:
      - hacksphere

networks:
  hacksphere:
    driver: bridge
