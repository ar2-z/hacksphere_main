version: "3.9"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env.production
    environment:
      - WEB_CONCURRENCY=4
      - PORT=8000
      - APP_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
