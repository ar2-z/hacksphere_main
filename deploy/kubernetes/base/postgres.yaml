apiVersion: apps/v1
kind: Deployment
metadata:
  name: hacksphere-postgres
  namespace: hacksphere
  labels:
    app: hacksphere-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hacksphere-postgres
  template:
    metadata:
      labels:
        app: hacksphere-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: hacksphere
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hacksphere-secrets
                  key: db-password
            - name: POSTGRES_DB
              value: hacksphere
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - hacksphere
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - hacksphere
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: hacksphere-postgres
  namespace: hacksphere
spec:
  selector:
    app: hacksphere-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: hacksphere
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
