apiVersion: apps/v1
kind: Deployment
metadata:
  name: hacksphere-celery-worker
  namespace: hacksphere
  labels:
    app: hacksphere-celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hacksphere-celery-worker
  template:
    metadata:
      labels:
        app: hacksphere-celery-worker
    spec:
      containers:
        - name: celery-worker
          image: hacksphere/api:latest
          command: ["celery", "-A", "app.core.celery", "worker", "--loglevel=info", "--concurrency=4", "-Q", "default,quiz,debugging"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hacksphere-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: hacksphere-secrets
                  key: redis-url
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: hacksphere-secrets
                  key: celery-broker-url
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - app.core.celery
                - inspect
                - ping
            initialDelaySeconds: 30
            periodSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hacksphere-celery-beat
  namespace: hacksphere
  labels:
    app: hacksphere-celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hacksphere-celery-beat
  template:
    metadata:
      labels:
        app: hacksphere-celery-beat
    spec:
      containers:
        - name: celery-beat
          image: hacksphere/api:latest
          command: ["celery", "-A", "app.core.celery", "beat", "--loglevel=info"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hacksphere-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: hacksphere-secrets
                  key: redis-url
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: hacksphere-secrets
                  key: celery-broker-url
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
