{% extends "base.html" %}
{% block title %}HackSphere - Register{% endblock %}
{% block content %}
<div class="split-layout">
  <div class="hero-panel">
    <div class="hero-content">
      <div class="logo-icon">⚡</div>
      <h1 class="hero-title">Join HackSphere</h1>
      <p class="hero-subtitle">Create your account and start competing</p>
      <div class="hero-animations">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
      </div>
    </div>
  </div>
  <div class="form-panel">
    <div class="glass-card register-card">
      <h2 class="card-title">Create Account</h2>
      <p class="card-subtitle">Fill in your details to get started</p>
      <div id="error-message" class="alert alert-error hidden"></div>
      <form id="register-form">
        <div class="form-group">
          <label for="full_name">Full Name</label>
          <input type="text" id="full_name" name="full_name" class="form-input" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" class="form-input" placeholder="Choose a username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="Create a password" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Confirm your password" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="team_name">Team Name</label>
          <input type="text" id="team_name" name="team_name" class="form-input" placeholder="Enter your team name" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Create Account</button>
      </form>
      <p class="form-footer">Already have an account? <a href="/login" class="link-accent">Sign In</a></p>
    </div>
  </div>
</div>
{% endblock %}
