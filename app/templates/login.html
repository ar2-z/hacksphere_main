{% extends "base.html" %}
{% block title %}HackSphere - Login{% endblock %}
{% block content %}
<div class="split-layout">
  <div class="hero-panel">
    <div class="hero-content">
      <div class="logo-icon">⚡</div>
      <h1 class="hero-title">HackSphere</h1>
      <p class="hero-subtitle">Where innovation meets competition</p>
      <div class="hero-animations">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
      </div>
    </div>
  </div>
  <div class="form-panel">
    <div class="glass-card login-card">
      <h2 class="card-title">Welcome Back</h2>
      <p class="card-subtitle">Sign in to your account</p>
      <div id="error-message" class="alert alert-error hidden"></div>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Sign In</button>
      </form>
      <p class="form-footer">Don't have an account? <a href="/register" class="link-accent">Register</a></p>
      <div class="admin-hint">
        <span class="hint-trigger">Admin access?</span>
        <div class="hint-content hidden">
          <p>Default admin credentials:</p>
          <code>Admin_main@123</code>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
