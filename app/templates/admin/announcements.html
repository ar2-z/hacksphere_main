{% extends "base.html" %}
{% block title %}HackSphere - Announcements{% endblock %}
{% block content %}
<nav class="navbar">
  <div class="nav-left">
    <span class="nav-logo">⚡ HackSphere Admin</span>
  </div>
  <div class="nav-right">
    <span id="user-name" class="nav-user"></span>
    <button id="logout-btn" class="btn btn-sm btn-danger">Logout</button>
  </div>
</nav>
<div class="admin-layout">
  <nav class="admin-tabs">
    <a href="/admin/dashboard" class="admin-tab">Dashboard</a>
    <a href="/admin/teams" class="admin-tab">Teams</a>
    <a href="/admin/quiz" class="admin-tab">Quiz</a>
    <a href="/admin/debug" class="admin-tab">Debug</a>
    <a href="/admin/ideathon" class="admin-tab">Ideathon</a>
    <a href="/admin/violations" class="admin-tab">Violations</a>
    <a href="/admin/announcements" class="admin-tab active">Announcements</a>
  </nav>
  <main class="admin-content">
    <section class="create-announcement-section">
      <h2>Create Announcement</h2>
      <form id="announcement-form" class="admin-form">
        <div class="form-group">
          <label for="announcement-message">Message</label>
          <textarea id="announcement-message" class="form-input" rows="3" placeholder="Enter announcement message..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Post Announcement</button>
      </form>
    </section>
    <section class="announcements-list-section">
      <h2>Active Announcements</h2>
      <div id="announcements-admin-list" class="announcements-list"></div>
    </section>
  </main>
</div>
{% endblock %}
