{% extends "base.html" %}
{% block title %}HackSphere - Admin Ideathon{% endblock %}
{% block content %}
<nav class="navbar">
  <div class="nav-left">
    <span class="nav-logo">⚡ HackSphere Admin</span>
  </div>
  <div class="nav-right">
    <span id="user-name" class="nav-user"></span>
    <button id="logout-btn" class="btn btn-sm btn-danger">Logout</button>
  </div>
</nav>
<div class="admin-layout">
  <nav class="admin-tabs">
    <a href="/admin/dashboard" class="admin-tab">Dashboard</a>
    <a href="/admin/teams" class="admin-tab">Teams</a>
    <a href="/admin/quiz" class="admin-tab">Quiz</a>
    <a href="/admin/debug" class="admin-tab">Debug</a>
    <a href="/admin/ideathon" class="admin-tab active">Ideathon</a>
    <a href="/admin/violations" class="admin-tab">Violations</a>
    <a href="/admin/announcements" class="admin-tab">Announcements</a>
  </nav>
  <main class="admin-content">
    <section class="ideathon-controls-section">
      <h2>Presentation Order Management</h2>
      <div id="presentation-order" class="presentation-order"></div>
    </section>
    <section class="ideathon-teams-section">
      <h2>Teams</h2>
      <div id="ideathon-teams" class="ideathon-teams"></div>
    </section>
  </main>
</div>
{% endblock %}
