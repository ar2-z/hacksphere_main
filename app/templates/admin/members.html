{% extends "base.html" %}
{% block title %}HackSphere - Admin Members{% endblock %}
{% block content %}
<nav class="navbar">
  <div class="nav-left">
    <span class="nav-logo">⚡ HackSphere Admin</span>
  </div>
  <div class="nav-right">
    <span id="user-name" class="nav-user"></span>
    <button id="logout-btn" class="btn btn-sm btn-danger">Logout</button>
  </div>
</nav>
<div class="admin-layout">
  <nav class="admin-tabs">
    <a href="/admin/dashboard" class="admin-tab">Dashboard</a>
    <a href="/admin/members" class="admin-tab active">Members</a>
    <a href="/admin/teams" class="admin-tab">Teams</a>
    <a href="/admin/quiz" class="admin-tab">Quiz</a>
    <a href="/admin/debug" class="admin-tab">Debug</a>
    <a href="/admin/ideathon" class="admin-tab">Ideathon</a>
    <a href="/admin/violations" class="admin-tab">Violations</a>
    <a href="/admin/announcements" class="admin-tab">Announcements</a>
  </nav>
  <main class="admin-content">
    <section>
      <h2>Registered Members</h2>
      <div class="table-wrapper">
        <table class="table">
          <thead>
            <tr>
              <th>Username</th>
              <th>Full Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Team</th>
              <th>Status</th>
              <th>Last Active</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="members-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>
{% endblock %}
